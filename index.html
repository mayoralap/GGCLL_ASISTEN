<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Acceso Autorizado</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>
body{font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#f4f4f9}
.card{background:#fff;padding:30px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.1);text-align:center;width:350px;box-sizing:border-box}
#buttonDiv{display:flex;justify-content:center;width:100%;margin-top:20px}
#mensaje{margin-top:20px;font-weight:bold}
</style></head><body>
<div class="card"><h2>Validación de Acceso</h2><p>Inicia sesión con tu cuenta de Google para verificar tus privilegios.</p><div id="buttonDiv"></div><div id="mensaje"></div></div>

<script>
const A="498552950849-4cj5lp97qrbqf63jc914ji96lq744m4t.apps.googleusercontent.com",
B="https://script.google.com/macros/s/AKfycbxmKCke-Uml5BbURcRdtimvhTPNuYMeWpzgY0SJPHCIbGAhJ07QDCbJlixMeGJNukY/exec";

function C(r){
    const m=document.getElementById('mensaje');
    m.style.color="#333";
    m.innerText="Validando credenciales...";
    const p=D(r.credential),e=p.email;
    window.location.href=B+"?email="+encodeURIComponent(e);
}

function D(t){
    const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(atob(b).split('').map(c=>'%'+('0'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
}

window.onload=()=>{

    google.accounts.id.initialize({
        client_id:A,
        callback:C,
        context:"signin",
        ux_mode:"popup",
        auto_select:true
    });

    google.accounts.id.renderButton(
        document.getElementById("buttonDiv"),
        {theme:"outline",size:"large",text:"signin_with",shape:"rectangular",width:"290"}
    );

    google.accounts.id.prompt();
};
</script>

</body></html>
