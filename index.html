<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Autorizado</title>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        #mensaje { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Validación de Acceso</h2>
        <p>Inicia sesión con tu cuenta de Google para verificar tus privilegios.</p>

        <!-- Botón de Google -->
        <div id="buttonDiv"></div>

        <div id="mensaje"></div>
    </div>

    <script>
        // Tu Client ID GIS
       const CLIENT_ID = "119857549248-i9sjchujsg9rlpcuuqnb01duggqrf2as.apps.googleusercontent.com";

        // Tu WebApp de Apps Script (modo exec)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwtVwJq6-AklownE9hx9yV31fi99XPVEihdBCkF58W41Bx-0CRJPznTpkNryHzcaV8/exec";

        function manejarRespuestaGoogle(response) {
            document.getElementById('mensaje').style.color = '#333';
            document.getElementById('mensaje').innerText = 'Validando credenciales...';

            const payload = parseJwt(response.credential);
            const email = payload.email;

            // Redirigir directamente a la Web App de Apps Script pasando el correo por parámetro GET.
            // Esto activará doGet(e) en el servidor, el cual evaluará tu función checkUserAccess 
            // y renderizará el sistema completo o el mensaje de error prediseñado en esta misma pestaña.
            window.location.href = `${SCRIPT_URL}?email=${encodeURIComponent(email)}`;
        }

        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
                '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2)
            ).join(''));
            return JSON.parse(jsonPayload);
        }

        window.onload = () => {
            google.accounts.id.initialize({
                client_id: CLIENT_ID,
                callback: manejarRespuestaGoogle,
                context: "signin",
                ux_mode: "popup",
                auto_select: true
            });

            google.accounts.id.renderButton(
                document.getElementById("buttonDiv"),
                { theme: "outline", size: "large", text: "signin_with", shape: "rectangular" }
            );

            google.accounts.id.prompt();
        };
    </script>

</body>
</html>
