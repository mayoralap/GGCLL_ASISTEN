<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Autorizado</title>
    <!-- Carga la librería de Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        #mensaje { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Validación de Acceso</h2>
        <p>Inicia sesión con tu cuenta de Google para verificar tus privilegios.</p>
        
        <!-- Contenedor del botón de Google -->
        <div id="buttonDiv"></div>
        
        <div id="mensaje"></div>
    </div>

    <script>
        // Remplaza esto con tu Client ID de Google Cloud Console (OAuth 2.0)
        const CLIENT_ID = 'TU_CLIENT_ID_DE_GOOGLE.apps.googleusercontent.com';
        // Remplaza esto con la URL de tu Web App de Google Apps Script desplegada
        const SCRIPT_URL = 'https://script.google.com/macros/s/TU_SCRIPT_ID/exec';

        function handleCredentialResponse(response) {
            document.getElementById('mensaje').innerText = 'Validando credenciales...';

            // Decodificar el JWT credential para extraer el email (o enviarlo crudo al Apps Script para que lo verifique)
            const responsePayload = parseJwt(response.credential);
            const userEmail = responsePayload.email;

            // Enviar el correo al Web App de Google Apps Script
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Necesario para evitar problemas de CORS básicos con GAS, aunque limita la lectura directa de respuesta si no se maneja bien
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email: userEmail })
            })
            .then(() => {
                document.getElementById('mensaje').style.color = 'green';
                document.getElementById('mensaje').innerText = `Acceso procesado para: ${userEmail}. Revisa tu autorización.`;
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('mensaje').style.color = 'red';
                document.getElementById('mensaje').innerText = 'Error al conectar con el servidor.';
            });
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: CLIENT_ID,
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById("buttonDiv"),
                { theme: "outline", size: "large", width: "280" }
            );
            google.accounts.id.prompt(); // Opcional: muestra el One Tap si aplica
        }
    </script>
</body>
</html>
